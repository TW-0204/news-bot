name: Daily Finance News Mailer

on:
  schedule:
    # 매일 한국 시간(KST) 오전 07:30 에 실행 (UTC 기준 전날 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 'Run workflow' 버튼으로 언제든 수동 테스트 실행 가능

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          pip install -r requirements.txt

      - name: 뉴스 수집 및 메일 발송 실행
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          NAVER_PASS_TEST: ${{ secrets.NAVER_PASS_TEST }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py
